# 个人网站的 Nginx 配置片段
#
# 线上实际形态：站点挂在 anime-chat 那个 server 块里，地址
#   http://47.254.207.200/me/     →  /var/www/me/
#
# 为什么不是独立的 server 块：这台机器 80 端口已被 anime-chat 用
#   `listen 80 default_server; server_name _;` 独占，
# 再建一个 server_name _ 的块会被它遮蔽、访问不到。所以走子路径。
#
# 用法：把下面几行贴进 /etc/nginx/sites-available/anime-chat 的 server{} 里，
#       放在 `location / { proxy_pass ... }` 之前，然后
#       nginx -t && systemctl reload nginx

    # ---- 个人网站（纯静态）：/me/ → /var/www/me/ ----
    location = /me {
        return 301 /me/;
    }

    location /me/assets/ {
        root /var/www;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /me/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 旧地址重定向，确认没人再访问后可以删掉
    location /portfolio/ {
        return 301 /me/;
    }

# 说明：
# - 用 root /var/www 而不是 alias，避开 alias + try_files 的尾斜杠坑。
#   URI /me/index.html → 文件 /var/www/me/index.html。
# - /me/assets/ 走一年强缓存（文件名带 hash），index.html 不缓存，
#   所以更新只要覆盖文件，刷新即生效。
# - 上传前先确认 anime-chat 没有占用你要用的路径：
#       curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8899/me
#   返回 404 才安全，否则会把它的路由遮掉。
